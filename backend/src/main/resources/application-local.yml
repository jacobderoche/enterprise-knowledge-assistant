# Standalone local profile: runs the backend with an in-memory H2 database so
# you can interact without Docker or Postgres. Activate with:
#   SPRING_PROFILES_ACTIVE=local mvn spring-boot:run
spring:
  datasource:
    url: jdbc:h2:mem:knowledge;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true

app:
  ai-service-base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
  jwt-secret: ${JWT_SECRET:local-dev-secret-change-me-please-32bytes-minimum!!}
  jwt-issuer-uri: ""
