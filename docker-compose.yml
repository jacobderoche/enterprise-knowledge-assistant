services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: knowledge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d knowledge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-service:
    build: ./ai-service
    environment:
      ENVIRONMENT: docker
      # Use offline providers by default; set real keys to enable OpenAI/Anthropic.
      LLM_PROVIDER: ${LLM_PROVIDER:-offline}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-offline}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DATABASE_URL: postgresql://app:app@postgres:5432/knowledge
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/knowledge
      DB_USER: app
      DB_PASSWORD: app
      AI_SERVICE_BASE_URL: http://ai-service:8000
      JWT_SECRET: local-dev-secret-change-me-please-32bytes-minimum!!
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
