[project]
name = "knowledge-assistant-ai"
version = "0.1.0"
description = "Permission-aware RAG AI service (FastAPI + LangGraph + pgvector)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
